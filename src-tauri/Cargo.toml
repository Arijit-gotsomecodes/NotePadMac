[package]
name = "notepadmac"
version = "2.0.1"
description = "Windows 11 Notepad clone for macOS"
authors = ["Arijit Deb"]
edition = "2021"

[lib]
name = "notepadmac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
dirs = "5"

# Already in the tree via tauri/wry, so this pulls in nothing new. Used to list
# the fonts actually installed on the machine.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-text = "0.3"
objc2-core-foundation = "0.3"
